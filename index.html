<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#101216">
    <title>Tabata Timer</title>
    <style>
        :root {
            --bg-color: #101216;
            --card-bg: #181c24;
            --surface-bg: #232936;
            --text-main: #f5f7fa;
            --text-muted: #9aa3b2;
            --accent: #3b82f6;
            --ring-track: rgba(255, 255, 255, 0.12);
        }

        body.prep-phase {
            --bg-color: #121d33;
            --card-bg: #17243d;
            --surface-bg: #223457;
            --accent: #60a5fa;
        }

        /* Fitnesszeit: Rot */
        body.work-phase {
            --bg-color: #2c1015;
            --card-bg: #38141b;
            --surface-bg: #4d1c26;
            --accent: #ff4d5a;
        }

        /* Ruhephase: Grün */
        body.rest-phase {
            --bg-color: #0f2918;
            --card-bg: #143620;
            --surface-bg: #1d4b2d;
            --accent: #2ecc71;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            margin: 0;
            padding: 16px;
            transition: background-color 0.35s ease;
            touch-action: manipulation;
        }

        .container {
            position: relative;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: clamp(1.3rem, 4vw, 2.2rem);
            border-radius: 26px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 460px;
            transition: background-color 0.35s ease;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h2 {
            margin: 0 0 1.25rem 0;
            font-size: clamp(1.35rem, 4vw, 1.75rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Screen 1: Einstellungen */
        .setup-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-bg);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background-color 0.35s ease;
        }

        label {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        input {
            width: 105px;
            padding: 10px 8px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(0, 0, 0, 0.25);
            color: var(--text-main);
            text-align: center;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .primary-go-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            background-color: #2ecc71;
            color: #071b0f;
            cursor: pointer;
            min-height: 54px;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .primary-go-btn:active {
            transform: scale(0.98);
        }

        /* Screen 2: Timer */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            min-height: 44px;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: var(--surface-bg);
            color: var(--text-main);
            font-size: 1.35rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        #status {
            flex: 1;
            font-size: clamp(1.1rem, 3.6vw, 1.4rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            transition: color 0.35s ease;
        }

        .top-spacer {
            width: 44px;
        }

        .ring-wrapper {
            position: relative;
            width: clamp(215px, 60vw, 260px);
            height: clamp(215px, 60vw, 260px);
            margin: 10px auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            overflow: visible;
        }

        .progress-ring__track {
            fill: none;
            stroke: var(--ring-track);
            stroke-width: 12;
        }

        .progress-ring__fill {
            fill: none;
            stroke: var(--accent);
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke 0.35s ease;
        }

        .ring-inner {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #timer {
            font-size: clamp(3.9rem, 16vw, 5.3rem);
            font-weight: 850;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
            text-align: center;
        }

        #round-info {
            font-size: clamp(1.05rem, 3.5vw, 1.25rem);
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 22px;
        }

        .timer-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .timer-buttons button {
            padding: 15px 12px;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            min-height: 54px;
            transition: transform 0.1s ease, filter 0.2s ease, background-color 0.2s ease;
        }

        .timer-buttons button:active {
            transform: scale(0.96);
        }

        .btn-start {
            background-color: #2ecc71;
            color: #071b0f;
        }

        .btn-pause {
            background-color: #f5c518;
            color: #1c1600;
        }

        #reset-btn {
            background-color: #ef4444;
            color: #ffffff;
        }

        #wake-status {
            margin-top: 14px;
            font-size: 0.8rem;
            color: var(--text-muted);
            min-height: 1.1rem;
        }

        @media (max-height: 540px) and (orientation: landscape) {
            body {
                padding: 10px;
            }
            .container {
                max-width: 720px;
            }
            .screen.active {
                display: block;
            }
            .timer-layout {
                display: grid;
                grid-template-columns: 1fr 1.1fr;
                gap: 16px;
                align-items: center;
            }
            .ring-wrapper {
                width: clamp(145px, 34vh, 185px);
                height: clamp(145px, 34vh, 185px);
                margin: 4px auto;
            }
            #timer {
                font-size: clamp(2.6rem, 10vh, 3.6rem);
            }
            #round-info {
                margin-bottom: 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- SCREEN 1: EINSTELLUNGEN -->
    <section id="setup-screen" class="screen active">
        <h2>Tabata Einstellungen</h2>

        <div class="setup-grid">
            <div class="input-row">
                <label for="work-time">Fitnesszeit (s)</label>
                <input type="number" id="work-time" inputmode="numeric" value="45" min="1">
            </div>
            <div class="input-row">
                <label for="rest-time">Ruhephase (s)</label>
                <input type="number" id="rest-time" inputmode="numeric" value="15" min="0">
            </div>
            <div class="input-row">
                <label for="rounds">Rundenanzahl</label>
                <input type="number" id="rounds" inputmode="numeric" value="10" min="1">
            </div>
        </div>

        <button id="go-to-timer-btn" class="primary-go-btn">Weiter zum Timer</button>
    </section>

    <!-- SCREEN 2: TIMER -->
    <section id="timer-screen" class="screen">
        <div class="top-bar">
            <button id="back-btn" class="back-btn" aria-label="Zurück zu den Einstellungen" title="Einstellungen">
                &#8592;
            </button>
            <div id="status">BEREIT</div>
            <div class="top-spacer"></div>
        </div>

        <div class="timer-layout">
            <div class="ring-wrapper">
                <svg class="progress-ring" viewBox="0 0 220 220" aria-hidden="true">
                    <circle class="progress-ring__track" cx="110" cy="110" r="96"></circle>
                    <circle id="ring-fill" class="progress-ring__fill" cx="110" cy="110" r="96"></circle>
                </svg>
                <div class="ring-inner">
                    <div id="timer">45</div>
                </div>
            </div>

            <div>
                <div id="round-info">Runde: 0 / 10</div>

                <div class="timer-buttons">
                    <button id="toggle-btn" class="btn-start">Start</button>
                    <button id="reset-btn">Reset</button>
                </div>
            </div>
        </div>

        <div id="wake-status"></div>
    </section>
</div>

<script>
    const PREP_SECONDS = 5;
    const RING_RADIUS = 96;
    const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

    let audioCtx = null;
    let isRunning = false;
    let isPaused = false;
    let timerInterval = null;
    let rafId = null;
    let wakeLock = null;

    let currentRound = 0;
    let totalRounds = 10;
    let workSec = 45;
    let restSec = 15;
    let phaseDuration = 45;
    let timeLeft = 45;
    let phase = "idle"; // "prep" | "work" | "rest" | "idle"

    // Zeitstempel für flüssigen Kreis und genaue Restzeit
    let phaseStartTime = 0;
    let phaseEndTime = 0;
    let pausedRemainingMs = 0;

    const setupScreen = document.getElementById("setup-screen");
    const timerScreen = document.getElementById("timer-screen");
    const statusEl = document.getElementById("status");
    const timerEl = document.getElementById("timer");
    const roundInfoEl = document.getElementById("round-info");
    const wakeStatusEl = document.getElementById("wake-status");
    const ringFillEl = document.getElementById("ring-fill");
    const toggleBtn = document.getElementById("toggle-btn");
    const resetBtn = document.getElementById("reset-btn");
    const backBtn = document.getElementById("back-btn");
    const goToTimerBtn = document.getElementById("go-to-timer-btn");
    const workInput = document.getElementById("work-time");
    const restInput = document.getElementById("rest-time");
    const roundsInput = document.getElementById("rounds");

    ringFillEl.style.strokeDasharray = `${RING_CIRCUMFERENCE} ${RING_CIRCUMFERENCE}`;
    ringFillEl.style.strokeDashoffset = "0";

    function setRingFraction(fractionRemaining) {
        const clamped = Math.max(0, Math.min(1, fractionRemaining));
        const offset = RING_CIRCUMFERENCE * (1 - clamped);
        ringFillEl.style.strokeDashoffset = `${offset}`;
    }

    function stopRingAnimation() {
        if (rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
        }
    }

    function animateRing() {
        if (!isRunning || isPaused || phase === "idle") {
            rafId = null;
            return;
        }

        const now = performance.now();
        const totalMs = Math.max(phaseDuration * 1000, 1);
        const remainingMs = Math.max(0, phaseEndTime - now);
        setRingFraction(remainingMs / totalMs);

        if (remainingMs > 0) {
            rafId = requestAnimationFrame(animateRing);
        } else {
            setRingFraction(0);
            rafId = null;
        }
    }

    function startRingAnimation(durationSec) {
        stopRingAnimation();
        const now = performance.now();
        phaseDuration = Math.max(durationSec, 1);
        phaseStartTime = now;
        phaseEndTime = now + phaseDuration * 1000;
        setRingFraction(1);
        rafId = requestAnimationFrame(animateRing);
    }

    function resumeRingAnimation() {
        stopRingAnimation();
        const now = performance.now();
        const totalMs = Math.max(phaseDuration * 1000, 1);
        phaseEndTime = now + pausedRemainingMs;
        phaseStartTime = phaseEndTime - totalMs;
        rafId = requestAnimationFrame(animateRing);
    }

    function showScreen(screenName) {
        if (screenName === "setup") {
            timerScreen.classList.remove("active");
            setupScreen.classList.add("active");
            document.body.className = "";
        } else {
            setupScreen.classList.remove("active");
            timerScreen.classList.add("active");
        }
    }

    function syncToggleButton() {
        if (isRunning && !isPaused) {
            toggleBtn.textContent = "Pause";
            toggleBtn.className = "btn-pause";
        } else {
            toggleBtn.textContent = "Start";
            toggleBtn.className = "btn-start";
        }
    }

    function ensureAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }
    }

    function playBeep(freq, duration, volume = 0.5) {
        ensureAudioContext();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.value = volume;

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function unlockAudioAndSpeechSync() {
        ensureAudioContext();
        if (audioCtx) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0.0001;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.02);
        }

        if ("speechSynthesis" in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.cancel();
            const primer = new SpeechSynthesisUtterance("");
            primer.lang = "en-US";
            primer.volume = 0;
            window.speechSynthesis.speak(primer);
        }
    }

    function speakEnglish(text, rate = 1.0) {
        if (!("speechSynthesis" in window)) return;

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = rate;
        utterance.volume = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const englishVoice =
            voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en-us")) ||
            voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en"));

        if (englishVoice) {
            utterance.voice = englishVoice;
        }

        window.speechSynthesis.speak(utterance);
    }

    async function requestWakeLock() {
        if ("wakeLock" in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request("screen");
                wakeStatusEl.textContent = "Display bleibt aktiv";
                wakeLock.addEventListener("release", () => {
                    if (!isRunning || isPaused) {
                        wakeStatusEl.textContent = "";
                    }
                });
            } catch (err) {
                wakeStatusEl.textContent = "";
            }
        }
    }

    async function releaseWakeLock() {
        if (wakeLock !== null) {
            try {
                await wakeLock.release();
                wakeLock = null;
            } catch (err) {
                // Ignorieren
            }
        }
        wakeStatusEl.textContent = "";
    }

    document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState === "visible" && isRunning && !isPaused) {
            await requestWakeLock();
            resumeRingAnimation();
        }
    });

    function updateTextAndPhaseUI(statusText, time, round, maxRounds, phaseClass = "") {
        statusEl.textContent = statusText;
        timerEl.textContent = time;
        roundInfoEl.textContent = `Runde: ${round} / ${maxRounds}`;
        document.body.className = phaseClass;
    }

    function readInputs() {
        workSec = Math.max(1, parseInt(workInput.value, 10) || 45);
        restSec = Math.max(0, parseInt(restInput.value, 10) || 0);
        totalRounds = Math.max(1, parseInt(roundsInput.value, 10) || 10);
        workInput.value = workSec;
        restInput.value = restSec;
        roundsInput.value = totalRounds;
    }

    function prepareTimerScreenFromInputs() {
        readInputs();
        currentRound = 0;
        phase = "idle";
        phaseDuration = workSec;
        timeLeft = workSec;
        isRunning = false;
        isPaused = false;
        stopRingAnimation();
        syncToggleButton();
        setRingFraction(1);
        updateTextAndPhaseUI("BEREIT", workSec, 0, totalRounds, "");
    }

    function startNewWorkout() {
        readInputs();
        unlockAudioAndSpeechSync();

        currentRound = 0;
        phase = "prep";
        timeLeft = PREP_SECONDS;
        isRunning = true;
        isPaused = false;

        syncToggleButton();
        requestWakeLock();
        updateTextAndPhaseUI("BEREIT MACHEN", timeLeft, 0, totalRounds, "prep-phase");
        startRingAnimation(PREP_SECONDS);
        speakEnglish("Get ready and we start in", 1.0);

        clearInterval(timerInterval);
        timerInterval = setInterval(tick, 1000);
    }

    function handlePrepCountdownTick() {
        if (timeLeft > 0) {
            updateTextAndPhaseUI("BEREIT MACHEN", timeLeft, 0, totalRounds, "prep-phase");

            if (timeLeft === 3) {
                speakEnglish("Three", 1.0);
            } else if (timeLeft === 2) {
                speakEnglish("Two", 1.0);
            } else if (timeLeft === 1) {
                speakEnglish("One", 1.0);
            }
        } else {
            playBeep(950, 0.6, 1.0);
            phase = "work";
            currentRound = 1;
            timeLeft = workSec;
            updateTextAndPhaseUI("FITNESS!", timeLeft, currentRound, totalRounds, "work-phase");
            startRingAnimation(workSec);
            if (timeLeft <= 3) {
                playBeep(600, 0.15, 0.4);
            }
        }
    }

    function handleActivePhaseTick() {
        const isWork = phase === "work";
        const label = isWork ? "FITNESS!" : "RUHE";
        const phaseClass = isWork ? "work-phase" : "rest-phase";

        if (timeLeft > 0) {
            updateTextAndPhaseUI(label, timeLeft, currentRound, totalRounds, phaseClass);
            if (timeLeft <= 3) {
                playBeep(600, 0.15, 0.4);
            }
        } else {
            playBeep(950, 0.6, 1.0);

            if (isWork && restSec > 0) {
                phase = "rest";
                timeLeft = restSec;
                updateTextAndPhaseUI("RUHE", timeLeft, currentRound, totalRounds, "rest-phase");
                startRingAnimation(restSec);
            } else {
                currentRound++;
                if (currentRound <= totalRounds) {
                    phase = "work";
                    timeLeft = workSec;
                    updateTextAndPhaseUI("FITNESS!", timeLeft, currentRound, totalRounds, "work-phase");
                    startRingAnimation(workSec);
                } else {
                    clearInterval(timerInterval);
                    stopRingAnimation();
                    setRingFraction(0);
                    isRunning = false;
                    isPaused = false;
                    phase = "idle";
                    syncToggleButton();
                    releaseWakeLock();
                    updateTextAndPhaseUI("FERTIG!", 0, totalRounds, totalRounds, "");
                }
            }
        }
    }

    function tick() {
        if (isPaused) return;

        timeLeft--;

        if (phase === "prep") {
            handlePrepCountdownTick();
        } else if (phase === "work" || phase === "rest") {
            handleActivePhaseTick();
        }
    }

    async function stopWorkoutToIdle() {
        clearInterval(timerInterval);
        stopRingAnimation();
        isRunning = false;
        isPaused = false;
        phase = "idle";
        currentRound = 0;

        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
        }
        await releaseWakeLock();
        syncToggleButton();
    }

    // Von Screen 1 auf Screen 2 wechseln (ohne Autostart)
    goToTimerBtn.addEventListener("click", async () => {
        unlockAudioAndSpeechSync();
        await stopWorkoutToIdle();
        prepareTimerScreenFromInputs();
        showScreen("timer");
    });

    // Pfeil links oben: Zurück zu den Einstellungen
    backBtn.addEventListener("click", async () => {
        await stopWorkoutToIdle();
        showScreen("setup");
    });

    // Start / Pause Umschalt-Button auf dem Timer-Screen
    toggleBtn.addEventListener("click", async () => {
        unlockAudioAndSpeechSync();

        if (!isRunning) {
            startNewWorkout();
            return;
        }

        if (!isPaused) {
            isPaused = true;
            pausedRemainingMs = Math.max(0, phaseEndTime - performance.now());
            stopRingAnimation();
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
            }
            syncToggleButton();
            statusEl.textContent = "PAUSIERT";
            await releaseWakeLock();
        } else {
            isPaused = false;
            syncToggleButton();
            if (phase === "prep") {
                statusEl.textContent = "BEREIT MACHEN";
                document.body.className = "prep-phase";
            } else if (phase === "work") {
                statusEl.textContent = "FITNESS!";
                document.body.className = "work-phase";
            } else if (phase === "rest") {
                statusEl.textContent = "RUHE";
                document.body.className = "rest-phase";
            }
            resumeRingAnimation();
            await requestWakeLock();
        }
    });

    // Reset-Button auf dem Timer-Screen
    resetBtn.addEventListener("click", async () => {
        await stopWorkoutToIdle();
        prepareTimerScreenFromInputs();
    });
</script>
</body>
</html>
