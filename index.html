<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0d12">
    <title>Tabata Timer</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --bg-glow: rgba(59, 130, 246, 0.14);
            --card-bg: rgba(20, 24, 34, 0.88);
            --card-border: rgba(255, 255, 255, 0.09);
            --surface-bg: rgba(255, 255, 255, 0.045);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --ring-track: rgba(255, 255, 255, 0.1);
        }

        body.prep-phase {
            --bg-color: #0c1424;
            --bg-glow: rgba(96, 165, 250, 0.22);
            --card-bg: rgba(18, 28, 48, 0.9);
            --surface-bg: rgba(96, 165, 250, 0.08);
            --accent: #60a5fa;
            --accent-glow: rgba(96, 165, 250, 0.42);
        }

        /* Fitnesszeit: Rot */
        body.work-phase {
            --bg-color: #1c0b10;
            --bg-glow: rgba(255, 77, 90, 0.24);
            --card-bg: rgba(36, 14, 20, 0.9);
            --surface-bg: rgba(255, 77, 90, 0.09);
            --accent: #ff4d5a;
            --accent-glow: rgba(255, 77, 90, 0.45);
        }

        /* Ruhephase: Grün */
        body.rest-phase {
            --bg-color: #091a11;
            --bg-glow: rgba(46, 204, 113, 0.22);
            --card-bg: rgba(13, 34, 23, 0.9);
            --surface-bg: rgba(46, 204, 113, 0.09);
            --accent: #2ecc71;
            --accent-glow: rgba(46, 204, 113, 0.42);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 50% 0%, var(--bg-glow), transparent 62%),
                radial-gradient(circle at 85% 90%, rgba(255, 255, 255, 0.025), transparent 45%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            margin: 0;
            padding: 16px;
            transition: background-color 0.4s ease, background-image 0.4s ease;
            touch-action: manipulation;
        }

        .container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            padding: clamp(1.35rem, 4.5vw, 2.25rem);
            border-radius: 30px;
            text-align: center;
            width: 100%;
            max-width: 450px;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.22s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--accent);
            background: var(--surface-bg);
            border: 1px solid var(--surface-border);
            padding: 5px 12px;
            border-radius: 999px;
            margin-bottom: 10px;
            transition: color 0.35s ease, background-color 0.35s ease;
        }

        h2 {
            margin: 0 0 1.35rem 0;
            font-size: clamp(1.4rem, 4.2vw, 1.8rem);
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        /* Screen 1: Einstellungen */
        .setup-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-bg);
            padding: 12px 16px;
            border-radius: 18px;
            border: 1px solid var(--surface-border);
            transition: background-color 0.35s ease, border-color 0.25s ease;
        }

        .input-row:focus-within {
            border-color: var(--accent);
        }

        .label-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        label {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .hint {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.32);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 4px 10px;
        }

        input {
            width: 62px;
            padding: 7px 2px;
            font-size: 1.2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            border: none;
            background: transparent;
            color: var(--text-main);
            text-align: center;
        }

        input:focus {
            outline: none;
        }

        .unit {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .primary-go-btn {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.08rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #051b11;
            box-shadow: 0 10px 24px rgba(16, 185, 129, 0.28);
            cursor: pointer;
            min-height: 56px;
            transition: transform 0.12s ease, filter 0.2s ease, box-shadow 0.2s ease;
        }

        .primary-go-btn:hover {
            filter: brightness(1.05);
        }

        .primary-go-btn:active {
            transform: scale(0.98);
        }

        /* Screen 2: Timer */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            min-height: 44px;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 1px solid var(--surface-border);
            background: var(--surface-bg);
            color: var(--text-main);
            font-size: 1.3rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .back-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .back-btn:active {
            transform: scale(0.94);
        }

        #status {
            flex: 1;
            font-size: clamp(1.05rem, 3.5vw, 1.35rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--accent);
            transition: color 0.35s ease;
        }

        .top-spacer {
            width: 44px;
        }

        .ring-wrapper {
            position: relative;
            width: clamp(220px, 60vw, 264px);
            height: clamp(220px, 60vw, 264px);
            margin: 10px auto 14px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 0 38px var(--accent-glow);
            transition: box-shadow 0.4s ease;
        }

        .progress-ring {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            overflow: visible;
        }

        .progress-ring__track {
            fill: rgba(0, 0, 0, 0.22);
            stroke: var(--ring-track);
            stroke-width: 11;
        }

        .progress-ring__fill {
            fill: none;
            stroke: var(--accent);
            stroke-width: 11;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px var(--accent-glow));
            transition: stroke 0.35s ease, filter 0.35s ease;
        }

        .ring-inner {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #timer {
            font-size: clamp(4rem, 16.5vw, 5.4rem);
            font-weight: 850;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
            text-align: center;
        }

        .sec-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .round-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 16px;
            border-radius: 999px;
            background: var(--surface-bg);
            border: 1px solid var(--surface-border);
            margin-bottom: 20px;
            transition: background-color 0.35s ease;
        }

        #round-info {
            font-size: clamp(0.98rem, 3.4vw, 1.15rem);
            color: var(--text-main);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .timer-buttons {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 12px;
        }

        .timer-buttons button {
            padding: 15px 14px;
            font-size: 1.05rem;
            font-weight: 800;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            min-height: 54px;
            transition: transform 0.12s ease, filter 0.2s ease, background-color 0.2s ease;
        }

        .timer-buttons button:hover {
            filter: brightness(1.05);
        }

        .timer-buttons button:active {
            transform: scale(0.96);
        }

        .btn-start {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #051b11;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.24);
        }

        .btn-pause {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f1400;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.24);
        }

        #reset-btn {
            background: rgba(239, 68, 68, 0.16);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.38);
        }

        #wake-status {
            margin-top: 14px;
            font-size: 0.78rem;
            color: var(--text-muted);
            min-height: 1.1rem;
        }

        @media (max-height: 540px) and (orientation: landscape) {
            body {
                padding: 10px;
            }
            .container {
                max-width: 740px;
                border-radius: 24px;
            }
            .brand-tag {
                margin-bottom: 6px;
            }
            h2 {
                margin-bottom: 12px;
            }
            .timer-layout {
                display: grid;
                grid-template-columns: 1fr 1.1fr;
                gap: 18px;
                align-items: center;
            }
            .ring-wrapper {
                width: clamp(148px, 34vh, 188px);
                height: clamp(148px, 34vh, 188px);
                margin: 4px auto;
            }
            #timer {
                font-size: clamp(2.6rem, 10vh, 3.6rem);
            }
            .round-pill {
                margin-bottom: 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- SCREEN 1: EINSTELLUNGEN -->
    <section id="setup-screen" class="screen active">
        <div class="brand-tag">Interval Workout</div>
        <h2>Tabata Einstellungen</h2>

        <div class="setup-grid">
            <div class="input-row">
                <div class="label-group">
                    <label for="work-time">Fitnesszeit</label>
                    <span class="hint">Belastungsphase</span>
                </div>
                <div class="input-box">
                    <input type="number" id="work-time" inputmode="numeric" value="45" min="1">
                    <span class="unit">s</span>
                </div>
            </div>
            <div class="input-row">
                <div class="label-group">
                    <label for="rest-time">Ruhephase</label>
                    <span class="hint">Erholung zwischen Runden</span>
                </div>
                <div class="input-box">
                    <input type="number" id="rest-time" inputmode="numeric" value="15" min="0">
                    <span class="unit">s</span>
                </div>
            </div>
            <div class="input-row">
                <div class="label-group">
                    <label for="rounds">Rundenanzahl</label>
                    <span class="hint">Wiederholungen gesamt</span>
                </div>
                <div class="input-box">
                    <input type="number" id="rounds" inputmode="numeric" value="10" min="1">
                    <span class="unit">x</span>
                </div>
            </div>
        </div>

        <button id="go-to-timer-btn" class="primary-go-btn">Weiter zum Timer</button>
    </section>

    <!-- SCREEN 2: TIMER -->
    <section id="timer-screen" class="screen">
        <div class="top-bar">
            <button id="back-btn" class="back-btn" aria-label="Zurück zu den Einstellungen" title="Einstellungen">
                &#8592;
            </button>
            <div id="status">BEREIT</div>
            <div class="top-spacer"></div>
        </div>

        <div class="timer-layout">
            <div class="ring-wrapper">
                <svg class="progress-ring" viewBox="0 0 220 220" aria-hidden="true">
                    <circle class="progress-ring__track" cx="110" cy="110" r="96"></circle>
                    <circle id="ring-fill" class="progress-ring__fill" cx="110" cy="110" r="96"></circle>
                </svg>
                <div class="ring-inner">
                    <div id="timer">45</div>
                    <div class="sec-label">Sekunden</div>
                </div>
            </div>

            <div>
                <div class="round-pill">
                    <div id="round-info">Runde: 0 / 10</div>
                </div>

                <div class="timer-buttons">
                    <button id="toggle-btn" class="btn-start">Start</button>
                    <button id="reset-btn">Reset</button>
                </div>
            </div>
        </div>

        <div id="wake-status"></div>
    </section>
</div>

<script>
    const PREP_SECONDS = 5;
    const RING_RADIUS = 96;
    const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

    let audioCtx = null;
    let isRunning = false;
    let isPaused = false;
    let timerInterval = null;
    let rafId = null;
    let wakeLock = null;

    let currentRound = 0;
    let totalRounds = 10;
    let workSec = 45;
    let restSec = 15;
    let phaseDuration = 45;
    let timeLeft = 45;
    let phase = "idle"; // "prep" | "work" | "rest" | "idle"

    let phaseStartTime = 0;
    let phaseEndTime = 0;
    let pausedRemainingMs = 0;

    const setupScreen = document.getElementById("setup-screen");
    const timerScreen = document.getElementById("timer-screen");
    const statusEl = document.getElementById("status");
    const timerEl = document.getElementById("timer");
    const roundInfoEl = document.getElementById("round-info");
    const wakeStatusEl = document.getElementById("wake-status");
    const ringFillEl = document.getElementById("ring-fill");
    const toggleBtn = document.getElementById("toggle-btn");
    const resetBtn = document.getElementById("reset-btn");
    const backBtn = document.getElementById("back-btn");
    const goToTimerBtn = document.getElementById("go-to-timer-btn");
    const workInput = document.getElementById("work-time");
    const restInput = document.getElementById("rest-time");
    const roundsInput = document.getElementById("rounds");

    ringFillEl.style.strokeDasharray = `${RING_CIRCUMFERENCE} ${RING_CIRCUMFERENCE}`;
    ringFillEl.style.strokeDashoffset = "0";

    function setRingFraction(fractionRemaining) {
        const clamped = Math.max(0, Math.min(1, fractionRemaining));
        const offset = RING_CIRCUMFERENCE * (1 - clamped);
        ringFillEl.style.strokeDashoffset = `${offset}`;
    }

    function stopRingAnimation() {
        if (rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
        }
    }

    function animateRing() {
        if (!isRunning || isPaused || phase === "idle") {
            rafId = null;
            return;
        }

        const now = performance.now();
        const totalMs = Math.max(phaseDuration * 1000, 1);
        const remainingMs = Math.max(0, phaseEndTime - now);
        setRingFraction(remainingMs / totalMs);

        if (remainingMs > 0) {
            rafId = requestAnimationFrame(animateRing);
        } else {
            setRingFraction(0);
            rafId = null;
        }
    }

    function startRingAnimation(durationSec) {
        stopRingAnimation();
        const now = performance.now();
        phaseDuration = Math.max(durationSec, 1);
        phaseStartTime = now;
        phaseEndTime = now + phaseDuration * 1000;
        setRingFraction(1);
        rafId = requestAnimationFrame(animateRing);
    }

    function resumeRingAnimation() {
        stopRingAnimation();
        const now = performance.now();
        const totalMs = Math.max(phaseDuration * 1000, 1);
        phaseEndTime = now + pausedRemainingMs;
        phaseStartTime = phaseEndTime - totalMs;
        rafId = requestAnimationFrame(animateRing);
    }

    function showScreen(screenName) {
        if (screenName === "setup") {
            timerScreen.classList.remove("active");
            setupScreen.classList.add("active");
            document.body.className = "";
        } else {
            setupScreen.classList.remove("active");
            timerScreen.classList.add("active");
        }
    }

    function syncToggleButton() {
        if (isRunning && !isPaused) {
            toggleBtn.textContent = "Pause";
            toggleBtn.className = "btn-pause";
        } else {
            toggleBtn.textContent = "Start";
            toggleBtn.className = "btn-start";
        }
    }

    function ensureAudioContext() {
        if (!audioCtx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                audioCtx = new AudioCtx();
            }
        }
        if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume().catch(() => {});
        }
    }

    function playBeep(freq, duration, volume = 0.5) {
        ensureAudioContext();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.value = volume;

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function unlockAudioAndSpeechSync() {
        ensureAudioContext();
        if (audioCtx) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0.0001;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.02);
        }

        if ("speechSynthesis" in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.cancel();
            const primer = new SpeechSynthesisUtterance("");
            primer.lang = "en-US";
            primer.volume = 0;
            window.speechSynthesis.speak(primer);
        }
    }

    function speakEnglish(text, rate = 1.0) {
        if (!("speechSynthesis" in window)) return;

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = rate;
        utterance.volume = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const englishVoice =
            voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en-us")) ||
            voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en"));

        if (englishVoice) {
            utterance.voice = englishVoice;
        }

        window.speechSynthesis.speak(utterance);
    }

    async function requestWakeLock() {
        if ("wakeLock" in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request("screen");
                wakeStatusEl.textContent = "Display bleibt aktiv";
                wakeLock.addEventListener("release", () => {
                    if (!isRunning || isPaused) {
                        wakeStatusEl.textContent = "";
                    }
                });
            } catch (err) {
                wakeStatusEl.textContent = "";
            }
        }
    }

    async function releaseWakeLock() {
        if (wakeLock !== null) {
            try {
                await wakeLock.release();
                wakeLock = null;
            } catch (err) {
                // Ignorieren
            }
        }
        wakeStatusEl.textContent = "";
    }

    document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState === "visible" && isRunning && !isPaused) {
            ensureAudioContext();
            await requestWakeLock();
            resumeRingAnimation();
        }
    });

    function updateTextAndPhaseUI(statusText, time, round, maxRounds, phaseClass = "") {
        statusEl.textContent = statusText;
        timerEl.textContent = time;
        roundInfoEl.textContent = `Runde: ${round} / ${maxRounds}`;
        document.body.className = phaseClass;
    }

    function readInputs() {
        workSec = Math.max(1, parseInt(workInput.value, 10) || 45);
        restSec = Math.max(0, parseInt(restInput.value, 10) || 0);
        totalRounds = Math.max(1, parseInt(roundsInput.value, 10) || 10);
        workInput.value = workSec;
        restInput.value = restSec;
        roundsInput.value = totalRounds;
    }

    function prepareTimerScreenFromInputs() {
        readInputs();
        currentRound = 0;
        phase = "idle";
        phaseDuration = workSec;
        timeLeft = workSec;
        isRunning = false;
        isPaused = false;
        stopRingAnimation();
        syncToggleButton();
        setRingFraction(1);
        updateTextAndPhaseUI("BEREIT", workSec, 0, totalRounds, "");
    }

    function startNewWorkout() {
        readInputs();
        unlockAudioAndSpeechSync();

        currentRound = 0;
        phase = "prep";
        timeLeft = PREP_SECONDS;
        isRunning = true;
        isPaused = false;

        syncToggleButton();
        requestWakeLock();
        updateTextAndPhaseUI("BEREIT MACHEN", timeLeft, 0, totalRounds, "prep-phase");
        startRingAnimation(PREP_SECONDS);
        speakEnglish("Get ready and we start in", 1.0);

        clearInterval(timerInterval);
        timerInterval = setInterval(tick, 1000);
    }

    function handlePrepCountdownTick() {
        if (timeLeft > 0) {
            updateTextAndPhaseUI("BEREIT MACHEN", timeLeft, 0, totalRounds, "prep-phase");

            if (timeLeft === 3) {
                speakEnglish("Three", 1.0);
            } else if (timeLeft === 2) {
                speakEnglish("Two", 1.0);
            } else if (timeLeft === 1) {
                speakEnglish("One", 1.0);
            }
        } else {
            playBeep(950, 0.6, 1.0);
            phase = "work";
            currentRound = 1;
            timeLeft = workSec;
            updateTextAndPhaseUI("FITNESS!", timeLeft, currentRound, totalRounds, "work-phase");
            startRingAnimation(workSec);
            if (timeLeft <= 3) {
                playBeep(600, 0.15, 0.4);
            }
        }
    }

    function handleActivePhaseTick() {
        const isWork = phase === "work";
        const label = isWork ? "FITNESS!" : "RUHE";
        const phaseClass = isWork ? "work-phase" : "rest-phase";

        if (timeLeft > 0) {
            updateTextAndPhaseUI(label, timeLeft, currentRound, totalRounds, phaseClass);
            if (timeLeft <= 3) {
                playBeep(600, 0.15, 0.4);
            }
        } else {
            playBeep(950, 0.6, 1.0);

            if (isWork && restSec > 0) {
                phase = "rest";
                timeLeft = restSec;
                updateTextAndPhaseUI("RUHE", timeLeft, currentRound, totalRounds, "rest-phase");
                startRingAnimation(restSec);
            } else {
                currentRound++;
                if (currentRound <= totalRounds) {
                    phase = "work";
                    timeLeft = workSec;
                    updateTextAndPhaseUI("FITNESS!", timeLeft, currentRound, totalRounds, "work-phase");
                    startRingAnimation(workSec);
                } else {
                    clearInterval(timerInterval);
                    stopRingAnimation();
                    setRingFraction(0);
                    isRunning = false;
                    isPaused = false;
                    phase = "idle";
                    syncToggleButton();
                    releaseWakeLock();
                    updateTextAndPhaseUI("FERTIG!", 0, totalRounds, totalRounds, "");
                }
            }
        }
    }

    function tick() {
        if (isPaused) return;

        timeLeft--;

        if (phase === "prep") {
            handlePrepCountdownTick();
        } else if (phase === "work" || phase === "rest") {
            handleActivePhaseTick();
        }
    }

    async function stopWorkoutToIdle() {
        clearInterval(timerInterval);
        stopRingAnimation();
        isRunning = false;
        isPaused = false;
        phase = "idle";
        currentRound = 0;

        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
        }
        await releaseWakeLock();
        syncToggleButton();
    }

    goToTimerBtn.addEventListener("click", async () => {
        unlockAudioAndSpeechSync();
        await stopWorkoutToIdle();
        prepareTimerScreenFromInputs();
        showScreen("timer");
    });

    backBtn.addEventListener("click", async () => {
        await stopWorkoutToIdle();
        showScreen("setup");
    });

    toggleBtn.addEventListener("click", async () => {
        unlockAudioAndSpeechSync();

        if (!isRunning) {
            startNewWorkout();
            return;
        }

        if (!isPaused) {
            isPaused = true;
            pausedRemainingMs = Math.max(0, phaseEndTime - performance.now());
            stopRingAnimation();
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
            }
            syncToggleButton();
            statusEl.textContent = "PAUSIERT";
            await releaseWakeLock();
        } else {
            isPaused = false;
            syncToggleButton();
            if (phase === "prep") {
                statusEl.textContent = "BEREIT MACHEN";
                document.body.className = "prep-phase";
            } else if (phase === "work") {
                statusEl.textContent = "FITNESS!";
                document.body.className = "work-phase";
            } else if (phase === "rest") {
                statusEl.textContent = "RUHE";
                document.body.className = "rest-phase";
            }
            resumeRingAnimation();
            await requestWakeLock();
        }
    });

    resetBtn.addEventListener("click", async () => {
        await stopWorkoutToIdle();
        prepareTimerScreenFromInputs();
    });
</script>

</body>
